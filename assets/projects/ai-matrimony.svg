<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="grad-ai-matrimony" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="border-grad-ai-matrimony" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.1" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;display=swap');
      .title { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 28px; fill: #F8FAFC; }
      .desc { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; fill: #94A3B8; }
      .tag-text { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; fill: #EC4899; }
    </style>
  </defs>

  <rect width="600" height="300" rx="20" fill="#0B1120" />
  <rect width="600" height="300" rx="20" fill="url(#grad-ai-matrimony)" stroke="url(#border-grad-ai-matrimony)" stroke-width="2" />
  
  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="#EC4899" fill-opacity="0.2" stroke="#EC4899" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="30" cy="30" r="12" fill="#8B5CF6" opacity="0.8"/>
    <circle cx="30" cy="30" r="6" fill="#FFF" opacity="0.9"/>
  </g>

  <text x="120" y="80" class="title">AI Matrimony Platform</text>
  
  <foreignObject x="120" y="100" width="440" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Inter', sans-serif; font-size: 16px; color: #94A3B8; line-height: 1.5;">
      Next-gen matchmaking leveraging deep learning and semantic matching.
    </div>
  </foreignObject>

  <!-- Tags -->
  <g transform="translate(120, 180)">
    <rect x="0" y="0" width="80" height="28" rx="8" fill="#EC4899" fill-opacity="0.1" stroke="#EC4899" stroke-opacity="0.3"/>
    <text x="40" y="18" text-anchor="middle" class="tag-text">Node.js</text>
    
    <rect x="90" y="0" width="90" height="28" rx="8" fill="#EC4899" fill-opacity="0.1" stroke="#EC4899" stroke-opacity="0.3"/>
    <text x="135" y="18" text-anchor="middle" class="tag-text">MongoDB</text>
    
    <rect x="190" y="0" width="80" height="28" rx="8" fill="#EC4899" fill-opacity="0.1" stroke="#EC4899" stroke-opacity="0.3"/>
    <text x="230" y="18" text-anchor="middle" class="tag-text">OpenAI</text>
    
    <rect x="280" y="0" width="80" height="28" rx="8" fill="#EC4899" fill-opacity="0.1" stroke="#EC4899" stroke-opacity="0.3"/>
    <text x="320" y="18" text-anchor="middle" class="tag-text">Next.js</text>
  </g>
  
  <!-- Buttons -->
  <g transform="translate(120, 240)">
    <rect x="0" y="0" width="140" height="36" rx="18" fill="#F8FAFC" />
    <text x="70" y="22" text-anchor="middle" font-family="Inter" font-weight="600" font-size="14" fill="#050816">View Project ↗</text>
    
    <rect x="150" y="0" width="120" height="36" rx="18" fill="transparent" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="210" y="22" text-anchor="middle" font-family="Inter" font-weight="600" font-size="14" fill="#F8FAFC">GitHub</text>
  </g>
</svg>