<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240">
  <defs>
    <linearGradient id="bg-grad-google-cloud-engineer-ai-agents" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="border-grad-google-cloud-engineer-ai-agents" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.15" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap');
      .title { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 20px; fill: #F8FAFC; }
      .issuer { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 11px; fill: #38BDF8; letter-spacing: 1.2px; text-transform: uppercase; }
      .category { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px; fill: #94A3B8; }
      .desc { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 13px; fill: #94A3B8; line-height: 1.4; }
      .tag-text { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px; fill: #E2E8F0; }
      .badge-type { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 11px; fill: #10B981; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="240" rx="16" fill="#0B1120" />
  <rect width="600" height="240" rx="16" fill="url(#bg-grad-google-cloud-engineer-ai-agents)" stroke="url(#border-grad-google-cloud-engineer-ai-agents)" stroke-width="1.5" />

  <!-- Top Issuer Header -->
  <g transform="translate(25, 20)">
    <circle cx="6" cy="6" r="5" fill="#4285F4" />
    <text x="18" y="10" class="issuer">Google Cloud • Skills Boost & Credly</text>
    <text x="550" y="10" text-anchor="end" class="badge-type">Skill Badge • Intermediate</text>
  </g>

  <!-- Icon Emblem -->
  <g transform="translate(25, 42)">
    <rect width="44" height="44" rx="12" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="22" cy="22" r="11" fill="#10B981" fill-opacity="0.8" />
    <circle cx="22" cy="22" r="5" fill="#FFF" />
  </g>

  <!-- Title & Category -->
  <text x="82" y="62" class="title">Engineer AI Agents with ADK</text>
  <text x="82" y="80" class="category">📂 Artificial Intelligence</text>

  <!-- Description -->
  <foreignObject x="25" y="98" width="550" height="52">
    <div xmlns="http://www.w3.org/1999/xhtml" class="desc">
      Autonomous agent design, Agent Development Kit (ADK), multi-step tool calling, context chaining, and prompt orchestration.
    </div>
  </foreignObject>

  <!-- Skill Tags -->
  <g transform="translate(25, 158)">
    <rect x="0" y="0" width="135" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="67" y="16" text-anchor="middle" class="tag-text">AI Agents</text>

    <rect x="145" y="0" width="135" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="212" y="16" text-anchor="middle" class="tag-text">Agent Dev Kit</text>

    <rect x="290" y="0" width="130" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="355" y="16" text-anchor="middle" class="tag-text">Gemini</text>

    <rect x="430" y="0" width="140" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="500" y="16" text-anchor="middle" class="tag-text">Cloud AI</text>
  </g>

  <!-- Verification Footer -->
  <g transform="translate(25, 198)">
    <rect x="0" y="0" width="150" height="24" rx="12" fill="#F8FAFC" />
    <text x="75" y="16" text-anchor="middle" font-family="Inter" font-weight="700" font-size="10" fill="#050816">VERIFIED BADGE ✓</text>
    
    <text x="550" y="16" text-anchor="end" font-family="Inter" font-weight="600" font-size="12" fill="#38BDF8">Official License &amp; Credential</text>
  </g>
</svg>