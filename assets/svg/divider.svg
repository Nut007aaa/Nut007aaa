<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 40" width="100%" height="40">
  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050816" stop-opacity="0" />
      <stop offset="20%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="1" />
      <stop offset="80%" stop-color="#22D3EE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#050816" stop-opacity="0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="0" y="19" width="1000" height="2" fill="url(#divider-grad)" filter="url(#glow)" />
  <circle cx="500" cy="20" r="4" fill="#F8FAFC" filter="url(#glow)" />
</svg>
