<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&amp;display=swap');
      
      .text-base {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 48px;
        font-weight: 700;
        fill: url(#gradient);
        opacity: 0;
      }
      
      .cursor {
        fill: #F8FAFC;
        animation: blink 1s step-end infinite;
      }

      /* Simple typing animation simulation for SVGs */
      .type1 { animation: type1 12s linear infinite; }
      .type2 { animation: type2 12s linear infinite; }
      .type3 { animation: type3 12s linear infinite; }
      .type4 { animation: type4 12s linear infinite; }

      @keyframes type1 {
        0%, 20% { opacity: 1; }
        22%, 100% { opacity: 0; }
      }
      @keyframes type2 {
        0%, 23% { opacity: 0; }
        25%, 45% { opacity: 1; }
        47%, 100% { opacity: 0; }
      }
      @keyframes type3 {
        0%, 48% { opacity: 0; }
        50%, 70% { opacity: 1; }
        72%, 100% { opacity: 0; }
      }
      @keyframes type4 {
        0%, 73% { opacity: 0; }
        75%, 95% { opacity: 1; }
        97%, 100% { opacity: 0; }
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="transparent" />
  
  <text x="50" y="110" class="text-base type1">Building the Future with AI</text>
  <text x="50" y="110" class="text-base type2">Crafting Premium Experiences</text>
  <text x="50" y="110" class="text-base type3">Scaling Cloud Architectures</text>
  <text x="50" y="110" class="text-base type4">Senior Software Engineer &amp; Designer</text>
  
  <rect x="740" y="70" width="4" height="50" class="cursor" />
</svg>
