<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none">
  <defs>
    <linearGradient id="stat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;display=swap');
      .header { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 16px; fill: #38BDF8; }
      .stat-val { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 24px; fill: #F8FAFC; }
      .stat-lbl { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px; fill: #94A3B8; text-transform: uppercase; letter-spacing: 1px; }
      .badge-lbl { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 11px; fill: #10B981; }
    </style>
  </defs>

  <rect width="495" height="195" rx="8" fill="#0B1120" />
  <rect width="495" height="195" rx="8" fill="url(#stat-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(25, 26)">
    <circle cx="6" cy="6" r="6" fill="#38BDF8" />
    <text x="20" y="11" class="header">Anish Shaik's GitHub Stats</text>
    
    <rect x="300" y="-3" width="145" height="22" rx="11" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" stroke-width="1" />
    <text x="372" y="12" text-anchor="middle" class="badge-lbl">✓ VERIFIED DEVELOPER</text>
  </g>

  <!-- Divider line -->
  <line x1="25" y1="52" x2="470" y2="52" stroke="#1E293B" stroke-width="1" />

  <!-- Stat 1: Total Contributions -->
  <g transform="translate(25, 70)">
    <circle cx="16" cy="24" r="18" fill="#38BDF8" fill-opacity="0.12" />
    <text x="16" y="30" text-anchor="middle" font-family="Inter" font-size="16" fill="#38BDF8">⚡</text>
    <text x="48" y="20" class="stat-lbl">Contributions</text>
    <text x="48" y="46" class="stat-val">6+</text>
  </g>

  <!-- Stat 2: Repositories -->
  <g transform="translate(180, 70)">
    <circle cx="16" cy="24" r="18" fill="#8B5CF6" fill-opacity="0.12" />
    <text x="16" y="30" text-anchor="middle" font-family="Inter" font-size="16" fill="#8B5CF6">📦</text>
    <text x="48" y="20" class="stat-lbl">Repositories</text>
    <text x="48" y="46" class="stat-val">3</text>
  </g>

  <!-- Stat 3: Current Streak -->
  <g transform="translate(330, 70)">
    <circle cx="16" cy="24" r="18" fill="#F59E0B" fill-opacity="0.12" />
    <text x="16" y="30" text-anchor="middle" font-family="Inter" font-size="16" fill="#F59E0B">🔥</text>
    <text x="48" y="20" class="stat-lbl">Active Streak</text>
    <text x="48" y="46" class="stat-val">1 Day</text>
  </g>

  <!-- Stat 4: Credly Badges & Skills -->
  <g transform="translate(25, 134)">
    <rect width="445" height="38" rx="8" fill="#1E293B" fill-opacity="0.7" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1" />
    <circle cx="24" cy="19" r="10" fill="#FF6B00" fill-opacity="0.2" />
    <text x="24" y="24" text-anchor="middle" font-family="Inter" font-size="12" fill="#FF6B00">🎖️</text>
    <text x="45" y="23" font-family="Inter" font-weight="600" font-size="12" fill="#F8FAFC">3 Credly Badges Verified • 15+ Specialized AI &amp; Cloud Skills</text>
  </g>
</svg>